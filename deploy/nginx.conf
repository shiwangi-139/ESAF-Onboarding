# /etc/nginx/sites-available/csp-onboarding  (replace csp.yourcompany.in with your domain)
# Certificates: sudo certbot --nginx -d csp.yourcompany.in   (or use your company certificate)

limit_req_zone $binary_remote_addr zone=csp_form:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=csp_upload:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=csp_auth:10m rate=10r/m;

server {
    listen 80;
    server_name csp.yourcompany.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name csp.yourcompany.in;

    ssl_certificate     /etc/letsencrypt/live/csp.yourcompany.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csp.yourcompany.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 16m;
    client_body_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location /static/ {
        alias /srv/csp-onboarding/app/webform/static/;
        expires 1h;
    }

    location = /apply/upload {
        limit_req zone=csp_upload burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /apply {
        limit_req zone=csp_form burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /auth/ {
        limit_req zone=csp_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Optional: restrict the dashboard to office / VPN IP ranges.
    location / {
        # allow 203.0.113.0/24;   # office
        # deny all;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
