# Routes for the CSP onboarding app on indev.eko.in.
# Included from the indev.eko.in server block in /etc/nginx (added once by deploy/link-domain.sh).
# After changing this file: sudo nginx -t && sudo systemctl reload nginx
# The app (webform/app.py) must be running on port 5055.

location ~ ^/(apply|dashboard|auth|static|form)(/|$) {
    proxy_pass http://127.0.0.1:5055;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 16m;
    proxy_read_timeout 120s;
}
